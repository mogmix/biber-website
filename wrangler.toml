name = "biber-website"
main = "src/worker.ts"
compatibility_date = "2024-01-01"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./dist"
binding = "ASSETS"

[vars]
# Non-secret vars go here. Secrets (DATABASE_URL, AUTH_TOKEN) are set
# via `wrangler secret put DATABASE_URL` / `wrangler secret put AUTH_TOKEN`.
